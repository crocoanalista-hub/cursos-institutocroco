<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Book Gratuito – Instituto Croco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0C0C0C;
    --surface: #141414;
    --border:  #222;
    --accent:  #C9A84C;
    --text-1:  #F4F6F4;
    --text-2:  #8a9e92;
    --text-3:  #4a5e53;
  }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    gap: 28px;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: contain;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 400;
    color: var(--text-1);
    text-align: center;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-2);
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input {
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text-1);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }

  .btn {
    padding: 13px;
    background: var(--accent);
    color: #0C0C0C;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 4px;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .erro { font-size: 12px; color: #EF4444; text-align: center; }

  /* Estado pós-submit */
  .download-box {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    text-align: center;
  }
  .download-box.visivel { display: flex; }

  .check {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #C9A84C22;
    border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .download-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #0C0C0C;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .download-btn:hover { opacity: 0.88; }

  .back { font-size: 13px; color: var(--text-2); text-decoration: none; letter-spacing: 0.04em; }
  .back:hover { color: var(--accent); }
</style>

<img class="logo"
  src="https://institutocroco.com.br/wp-content/uploads/2024/05/ok-2-e1752525529340.png"
  alt="Instituto Croco">

<img src="https://institutocroco.com.br/wp-content/uploads/elementor/thumbs/mock-00001-2-qthduaugwp0kjj0nmbckngjfq07wfiurnp3l3jszvk.png"
  alt="E-Book Introdução à Psicanálise"
  style="width:100%;max-width:320px;border-radius:10px;border:1px solid #222;">

<h1>Introdução à Psicanálise</h1>
<p class="subtitle">Preencha o formulário abaixo e baixe seu e-book gratuito</p>

<!-- Formulário -->
<div class="card" id="formBox">
  <label>Nome <input id="nome" type="text" placeholder="Seu nome completo" required></label>
  <label>E-mail <input id="email" type="email" placeholder="seu@email.com" required></label>
  <label>WhatsApp <input id="whatsapp" type="tel" placeholder="(11) 99999-9999" required></label>
  <button class="btn" id="btnEnviar" onclick="enviar()">Baixar E-book Grátis</button>
  <div class="erro" id="erro"></div>
</div>

<!-- Pós-submit -->
<div class="download-box" id="downloadBox">
  <div class="check">✓</div>
  <div>
    <div style="font-weight:700;font-size:16px;color:var(--text-1);margin-bottom:6px">Tudo certo!</div>
    <div style="font-size:13px;color:var(--text-2)">Seu e-book está pronto para download</div>
  </div>
  <a class="download-btn" id="linkDownload" href="#" target="_blank" rel="noopener">⬇ Baixar Agora</a>
</div>

<a class="back" href="../">← Voltar para os cursos</a>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey:            "AIzaSyC9f0Ro4jRK-0wt-CIiWP9VvyoBsHdRsBY",
    authDomain:        "instituto-croco.firebaseapp.com",
    projectId:         "instituto-croco",
    storageBucket:     "instituto-croco.firebasestorage.app",
    messagingSenderId: "464376102261",
    appId:             "1:464376102261:web:276180135556857cc9673c",
  });
  const db = getFirestore(app);

  // Link do PDF — substitua pela URL real do arquivo
  const PDF_URL = "/ebooksgratuitos/Ebook-Psicanalise.pdf";

  window.enviar = async function () {
    const nome     = document.getElementById("nome").value.trim();
    const email    = document.getElementById("email").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const erro     = document.getElementById("erro");
    const btn      = document.getElementById("btnEnviar");

    erro.textContent = "";
    if (!nome || !email || !whatsapp) { erro.textContent = "Preencha todos os campos."; return; }
    if (!/\S+@\S+\.\S+/.test(email))  { erro.textContent = "E-mail inválido."; return; }

    btn.disabled = true;
    btn.textContent = "Enviando…";

    try {
      await addDoc(collection(db, "leadsEbook"), {
        nome, email, whatsapp,
        origem: "ebook-psicanalise",
        criadoEm: serverTimestamp(),
      });

      document.getElementById("formBox").style.display = "none";
      document.getElementById("linkDownload").href = PDF_URL;
      document.getElementById("downloadBox").classList.add("visivel");
    } catch (e) {
      erro.textContent = "Erro ao salvar. Tente novamente.";
      btn.disabled = false;
      btn.textContent = "Baixar E-book Grátis";
    }
  };
</script>
