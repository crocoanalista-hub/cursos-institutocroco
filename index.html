<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0C0C0C;
    --surface:  #141414;
    --border:   #1f1f1f;
    --accent:   #C9A84C;
    --accent-2: #3d7a5e;
    --text-1:   #F4F6F4;
    --text-2:   #8a9e92;
    --text-3:   #4a5e53;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:      #f5f3ee;
      --surface: #ffffff;
      --border:  #e2ddd6;
      --accent:  #B8952F;
      --accent-2:#2d6650;
      --text-1:  #111a14;
      --text-2:  #5a6e62;
      --text-3:  #9aaa9f;
    }
  }
  :root[data-theme="light"] {
    --bg:      #f5f3ee;
    --surface: #ffffff;
    --border:  #e2ddd6;
    --accent:  #B8952F;
    --accent-2:#2d6650;
    --text-1:  #111a14;
    --text-2:  #5a6e62;
    --text-3:  #9aaa9f;
  }
  :root[data-theme="dark"] {
    --bg:       #0C0C0C;
    --surface:  #141414;
    --border:   #1f1f1f;
    --accent:   #C9A84C;
    --accent-2: #3d7a5e;
    --text-1:   #F4F6F4;
    --text-2:   #8a9e92;
    --text-3:   #4a5e53;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
  }

  .header {
    width: 100%;
    max-width: 320px;
    padding: 40px 0 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .logo-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-divider {
    width: 28px;
    height: 1px;
    background: var(--accent);
    opacity: 0.6;
  }

  .logo-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 6vw, 38px);
    font-weight: 600;
    color: var(--text-1);
    text-wrap: balance;
    text-align: center;
    line-height: 1.15;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-2);
    text-align: center;
    max-width: 340px;
    line-height: 1.6;
    font-weight: 300;
  }

  .divider {
    width: 100%;
    max-width: 320px;
    height: 1px;
    background: var(--border);
    margin-bottom: 28px;
  }

  .courses {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .course-btn {
    display: block;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    cursor: pointer;
    text-decoration: none;
    background: var(--surface);
    position: relative;
  }

  .course-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s ease;
    pointer-events: none;
  }

  .course-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(201, 168, 76, 0.35);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  .course-btn:hover::after { opacity: 0.04; }

  .course-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .course-btn img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 11px;
  }

  .course-btn.whatsapp { border-color: rgba(37, 211, 102, 0.2); }

  .course-btn.whatsapp:hover {
    border-color: rgba(37, 211, 102, 0.45);
    box-shadow: 0 8px 28px rgba(37, 211, 102, 0.1);
  }

  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* ── Mobile ── */
  @media (max-width: 480px) {
    body { padding: 0 8px 16px; min-height: unset; }
    .header { max-width: 100%; padding: 10px 0 6px; gap: 4px; }
    .headline { font-size: 28px; }
    .subtitle { font-size: 13px; max-width: 100%; }
    .logo-text { font-size: 11px; }
    .divider { max-width: 100%; margin-bottom: 8px; }
    .courses { max-width: 100%; gap: 8px; }
    .course-btn { border-radius: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .course-btn { transition: none; }
  }
</style>
